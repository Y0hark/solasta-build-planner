    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
    <script>
      // Thème posé avant le premier rendu : évite le flash de palette.
      // La liste doit rester alignée sur src/lib/themes.js.
      ;(function () {
        var themes = ['grimoire', 'crypte', 'forge', 'parchemin', 'marbre']
        var choisi
        try {
          choisi = localStorage.getItem('sbp-theme')
        } catch (e) {
          choisi = null
        }
        document.documentElement.dataset.theme =
          themes.indexOf(choisi) === -1 ? 'grimoire' : choisi
      })()
    </script>
